<!-- ახსენით რას ნიშნავს :first-child, :last-child და :nth-child -->
<!-- ეს სამივე CSS ფსევდო-კლასია, რომლებიც გამოიყენება ელემენტების ასარჩევად -->

<!-- ახსენით რა განსხვავებაა :first-child და :last-child შორის -->
<!-- :first-child ირჩევს მარტო სიის პირველ ელემენტს ხოლო :last-child კი პირიქით -->

<!-- ახსენით რას ნიშნავს :nth-child(even) და :nth-child(odd) -->
<!-- :nth-child(even) ირჩევს ლუწ ელემენტებს ხოლო :nth-child(odd) კი კენტებს -->

<!-- ახსენით, რომელ ელემენტებს მონიშნავს:
  - li:nth-child(even)
  - li:nth-child(odd)
  - li:first-child
  - li:last-child -->
<!-- li:nth-child(even) - ირჩევს სიის ლუწ ელემენტს
     li:nth-child(odd) - ირჩევს სიის კენტ ელემენტს
     li:first-child - ირჩევს სიის პირველ ელემენტს
     li:last-child - ირჩვს სიის ბოლო ელემენტს-->


<!-- შექმენით სია, რომელშიც იქნება მინიმუმ 10 ელემენტი. გამოიყენეთ:
  - :nth-child(even)
  - :nth-child(odd)
ლუწ და კენტ ელემენტებს უნდა ჰქონდეთ განსხვავებული:
  - ტექსტის ფერი
  - ფონის ფერი
  - ჩარჩო -->
<html>
    <head>
        <title>My website</title>
        <link rel="stylesheet" href="task.css">
    </head>
    <body>
        <ol class="list">
            <li>hi</li>
            <li>hi</li>
            <li>hi</li>
            <li>hi</li>
            <li>hi</li>
            <li>hi</li>
            <li>hi</li>
            <li>hi</li>
            <li>hi</li>
            <li>hi</li>
        </ol>
    </body>
</html>

<!-- შექმენით მინიმუმ 8 ელემენტისგან შემდგარი სია. გამოიყენეთ:
  - :first-child
  - :last-child

პირველ და ბოლო ელემენტს უნდა ჰქონდეს ერთმანეთისგან განსხვავებული:
  - ტექსტის ფერი
  - ფონის ფერი
  - ჩარჩო
  - ზომა -->
