<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">
        <img class="hero-image" src="photo/Screenshot 2026-10-01 223524.png" alt="Hero Illustration">
        
        <div class="card-content">
            <h1 class="title">Order Summary</h1>
            <p class="description">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

            <div class="plan-container">
                <div class="plan-details">
                    <img class="music-icon" src="photo/icon-music.svg" alt="Music Icon">
                    <div class="plan-text">
                        <h2 class="plan-title">Annual Plan</h2>
                        <p class="plan-price">$59.99/year</p>
                    </div>
                </div>
                <a href="" class="change-link">Change</a>
            </div>

            <button class="btn-primary">Proceed to Payment</button>
            <button class="btn-secondary">Cancel Order</button>
        </div>
    </main>

</body>
</html>
